<!DOCTYPE html>
<html>
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Student Result Calculator</title>
        <style>
            /* Inline styling to make it pretty */
            :root{--bg:#f3f6ff;--card:#ffffff;--accent:#0b63ff;--muted:#6b7280}
            body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);margin:0;padding:28px;display:flex;align-items:center;justify-content:center;min-height:100vh}
            .card{width:100%;max-width:720px;background:var(--card);padding:22px;border-radius:12px;box-shadow:0 10px 30px rgba(12,20,50,0.08)}
            h2{margin:0 0 14px;color:#0f1724}
            .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
            label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
            input[type=number]{width:100%;padding:10px;border-radius:8px;border:1px solid #e6eefc;font-size:15px}
            .actions{display:flex;gap:12px;align-items:center}
            button.primary{background:var(--accent);color:#fff;padding:10px 14px;border-radius:8px;border:0;font-weight:700;cursor:pointer}
            .secondary{background:#eef2ff;color:#0b63ff;border:1px solid #dbeafe}
            #total,#result{margin-top:12px;font-size:16px}
            #result{font-weight:800}
            @media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
            @media (max-width:420px){.grid{grid-template-columns:1fr}}
        </style>
    
</head>
<body>
    <div class="card">
        <h2>Student Result Calculator</h2>

        <div class="grid">
            <div>
                <label for="EngMarks">English</label>
                <input type="number" id="EngMarks" placeholder="English">
            </div>
            <div>
                <label for="NepMarks">Nepali</label>
                <input type="number" id="NepMarks" placeholder="Nepali">
            </div>
            <div>
                <label for="SciMarks">Science</label>
                <input type="number" id="SciMarks" placeholder="Science">
            </div>
            <div>
                <label for="MathsMarks">Maths</label>
                <input type="number" id="MathsMarks" placeholder="Maths">
            </div>
            <div>
                <label for="OptMathsMarks">Optional Maths</label>
                <input type="number" id="OptMathsMarks" placeholder="Optional Maths">
            </div>
            <div>
                <label for="SocMarks">Social</label>
                <input type="number" id="SocMarks" placeholder="Social">
            </div>
            <div>
                <label for="CompSciMarks">Computer</label>
                <input type="number" id="CompSciMarks" placeholder="Computer">
            </div>
            <div>
                <label for="HealthMarks">Health</label>
                <input type="number" id="HealthMarks" placeholder="Health">
            </div>
        </div>

        <div class="actions">
            <button class="primary" onclick="calculateResult()">Calculate Result</button>
            <button class="secondary" onclick="location.reload()">Reset</button>
        </div>

        <p id="total"></p>
        <p id="result"></p>

        <script src="script.js"></script>
    </div>

</body>
</html>
